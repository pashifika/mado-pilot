# Phase 2 native lifecycle transitions, measured on x86_64-pc-windows-msvc at
# implementation tree f02c3e9bc3c08d6faca4f032e6c819376ce5e0db, based on source
# commit 5c7c3b5434c4e5279e9dfc23568de5757914b641.
#
# Produced by `crates/mado-pilot/benches/native-phase2.rs`. ADR 0026 accepts
# this revision-bound Windows profile after repairing the resize and retained-
# pressure fixture lifecycle. Measurement values are the harness output.
# Latency ceilings are three times measured p95, rounded up; memory, stale-work,
# and mapped-byte ceilings are stated below. These are regression ceilings, not
# user-facing latency promises.

format_version = 1

[benchmark]
id = "phase-2-native-transitions-x86_64-pc-windows-msvc"
workload = "native open, retained-pressure recovery, resize, and close transitions"
phase = "2"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "crates/platform/windows fixture Rust and protocol sources"
fixture_sha256 = "f5acaea836b6eb5257fc7252fdaa2b4d8d6f2d5c0418b6109d956d2b3cd0a279"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF, 12 cores/20 threads, 32 GiB, NVIDIA GeForce RTX 4080"
os_version = "Windows 11 Pro 10.0.26200 (build 26200)"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release"
warmup_iterations = 5
sample_count = 20
correctness_oracle = "every retained sample checks frame identity/content, transition state, receipt/event sequence, or complete common-flow outcome as its measurement states"
queue_policy = "session latest-wins queue depth 1; retained-pressure case fills the reported finite storage limit"
notes = "source base commit 5c7c3b5434c4e5279e9dfc23568de5757914b641, measured implementation tree f02c3e9bc3c08d6faca4f032e6c819376ce5e0db; toolchain rustc 1.97.1 (8bab26f4f 2026-07-14); MSVC 19.44.35228; CMake 3.29.5; OpenCV 4.14.0; GPU/driver NVIDIA GeForce RTX 4080 driver 32.0.15.9186 (2026-01-20); display topology two 2560x1440 logical displays side by side, primary at (0,0), secondary at (-2560,0), GPU reports 3840x2160 at 120 Hz; permissions/signing Windows exposes no separate capture/input permission, unelevated interactive local process, unsigned candidate fixture; fixture path deliberately omitted"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 16777216
rationale = "16 MiB is more than three times the 3868790-byte measured peak and rejects repeated full-frame accumulation"

[[measurement]]
workload = "resize_recreation"
correctness_oracle = "one deterministic fixture resize advances epoch and geometry and returns the resized extent"
result_correctness = 0
latency_p50_ms = 72.179100
latency_p95_ms = 98.583200
iteration_span_ms = 73.613535
mapped_bytes_per_result = 0
peak_allocated_bytes = 13321
steady_allocated_bytes = 12913
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 300.0
  rationale = "three times the measured 98.583200 ms p95, rounded up"

[[measurement]]
workload = "open_first_frame"
correctness_oracle = "each fresh session returns a correctly identified deterministic first frame and closes"
result_correctness = 0
latency_p50_ms = 103.947400
latency_p95_ms = 110.547200
iteration_span_ms = 119.538455
mapped_bytes_per_result = 3860768
peak_allocated_bytes = 3868790
steady_allocated_bytes = 5318
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 340.0
  rationale = "three times the measured 110.547200 ms p95, rounded up"

  [[measurement.budget]]
  measure = "mapped_bytes_per_result"
  kind = "absolute"
  unit = "bytes"
  direction = "at_most"
  limit = 3860768
  rationale = "the resized 1208x799 fixture content at four bytes per pixel, exactly once"

[[measurement]]
workload = "retained_pressure_resume"
correctness_oracle = "filling the reported retained limit rejects publication, releasing one slot resumes with an observable sequence gap"
result_correctness = 0
latency_p50_ms = 17.256400
latency_p95_ms = 32.328600
iteration_span_ms = 1330.756030
mapped_bytes_per_result = 0
stale_work_ratio = 0.500000000
peak_allocated_bytes = 2356236
steady_allocated_bytes = 0
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 100.0
  rationale = "three times the measured 32.328600 ms p95, rounded up"

  [[measurement.budget]]
  measure = "stale_work_ratio"
  kind = "absolute"
  unit = "ratio"
  direction = "at_most"
  limit = 0.75
  rationale = "the deliberate full-buffer pressure measured 0.500000000; the ceiling allows one additional discarded publication while preserving bounded recovery"

[[measurement]]
workload = "close_drain"
correctness_oracle = "explicit close reaches the closed state and remains idempotent"
result_correctness = 0
latency_p50_ms = 2.179600
latency_p95_ms = 2.436000
iteration_span_ms = 118.050870
mapped_bytes_per_result = 0
peak_allocated_bytes = 7878
steady_allocated_bytes = 5270
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 8.0
  rationale = "three times the measured 2.436000 ms p95, rounded up"
