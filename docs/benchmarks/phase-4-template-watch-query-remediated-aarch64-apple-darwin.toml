executed_source = "dd628bc27f48a36fae4d894ae47a7237f1cca51f"
executed_tree = "768a3041bc74c9b61989ea1355901e944e192864"
startup_latency_budget = "withheld: no pre-remediation precursor predeclared a ceiling"
peak_resident_bytes = 54820864

