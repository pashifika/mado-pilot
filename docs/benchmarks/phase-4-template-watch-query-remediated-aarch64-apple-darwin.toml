format_version = 1

[benchmark]
id = "phase-4-template-watch-query-remediated-aarch64-apple-darwin"
workload = "independently reviewed deterministic Rust replay/OpenCV watcher plus controlled scheduler oracles"
phase = "4"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "fixtures/assets/phase1-slice and mado-pilot-testkit deterministic scenes"
fixture_sha256 = "f6a4a3c3a47096c97d50e05c0a0d0bb93a764c159770aa01face22e4dbd2c2a9"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 CPU cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo build --locked --release --package mado-pilot --bench template-watch-query; debug_assertions=false; five fresh sequential processes"
warmup_iterations = 3
sample_count = 20
process_count = 5
correctness_oracle = "every retained sample checks exact source, match, state, actual backend/mapping work, lifecycle outcomes, ownership, and producer progress"
queue_policy = "fixed scheduler descriptor: 256 engine queries, 16 active sessions, 64 queries per session, two analyses, one latest pending frame per query"
producer_surface_copy = "not applicable: immutable replay and controlled CPU frames own no producer surface"
notes = "executed source dd628bc27f48a36fae4d894ae47a7237f1cca51f; tree 768a3041bc74c9b61989ea1355901e944e192864; executable sha256 35b09906dafc2dd065b239cbc22bfa44141b047b339fd275aa22a39a9ac70666; OpenCV 4.14.0 observed and enforced; independent-review remediation; startup latency explicitly withheld; no retry or exclusion"
