# Phase 4 native template-watch precursor-bound enforcing profile at source
# 65da97b06d6de80ea7b59b0b16fd8bc022befea7 and tree
# 72b233d8b2e34ceee6452fde6f5b0c7bc2d3fa92.
# ADR 0053 fixes the budgets before the fresh final executable and cohort.

format_version = 1

[benchmark]
id = "phase-4-native-template-watch-x86_64-pc-windows-msvc"
workload = "native Rust facade maintained-session template-watch matrix"
phase = "4"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "repository native watch fixture plus generated watch-marker-v1"
fixture_sha256 = "8da74e743e96aebb3f430c283c849ef607d7cec1cd4f00223e5b81331485fe2e"
benchmark_executable_sha256 = "66c5b9b843565592bbbc26b423e8947adbad4481bedda6bc4f42432b447a9b7b"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF, 32 GiB"
os_version = "Windows 11 Pro 25H2 10.0.26200 UBR 9168; Windows SDK 10.0.26100.0"
deployment_target = "x86_64-pc-windows-msvc"
build_profile = "cargo build --locked --release --package mado-pilot --bench native-template-watch --features native-template-watch-qualification"
warmup_iterations = 3
sample_count = 20
process_count = 5
single_run_latency_budgets = "withheld by ADR 0053: eight gate rows retain one observation per process"
aggregate_mapping_budget = "withheld by ADR 0053: enforce exact mapping accounting and target-native aggregates"
cadence_count_budgets = "withheld by ADR 0053: enforce exact controlled counts and conservation relations"
producer_rate_budget = "withheld by ADR 0053: enforce monotonic progress without cross-target publication rate"
growth_budget_scope = "sampled workloads only; single-run gates have no post-warm growth measure"
resident_budget_scope = "every sampled workload and every gate row that reports target-native RSS"
correctness_oracle = "24 ordered source/match/geometry/work/lifecycle/ownership/resource/privacy hard gates"
queue_policy = "production finite latest-wins capture and template-watch scheduler"
notes = "source 65da97b06d6de80ea7b59b0b16fd8bc022befea7; tree 72b233d8b2e34ceee6452fde6f5b0c7bc2d3fa92; fixture-source ec02f34932ba99a01a88519028c0348f0c988b9cf5ea81f1d8a40e233d5d946e; backend opencv-4.14.0; toolchain rust-1.97.1-msvc-19.44.35228; host windows-i7-12700kf-32g; cohort precursor; process 1; control native-watch-control-v1"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies exact source, match, geometry, state, work, lifecycle, ownership, resource, privacy, and producer-progress oracles"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "sampled watcher operations return transient Rust allocations after warmup"
predicate = "allocated_growth_bytes <= 4096"

