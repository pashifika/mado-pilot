# Phase 3.1 integrated-zone OCR qualification on Apple M1 Pro. Exact precursor
# source 180c1b15df1a4c29bd6df14a790b9d18ac831bae; ADRs 0044 and 0045 fix budgets.

format_version = 1

[benchmark]
id = "phase-3-1-integrated-zone-ocr-aarch64-apple-darwin"
workload = "explicit bounded-v2 ONNX CPU singular plus fixed one/three/eight-zone, dense, empty, cancellation, retained-result, startup, cleanup, heap, growth, and final process RSS"
phase = "3.1"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "fixtures/ocr/g-004 fixture-manifest.json and its five SHA-256-bound PNGs plus derived deterministic frames and fixed caller-order non-overlapping zones"
fixture_sha256 = "a289edb167d45f11f4269cef22ff37d93d2cbe115020bcdb91dcfb664a5507e"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo bench, benchmark-instrumentation feature, debug_assertions=false; five fresh alternating-order integrated processes"
warmup_iterations = 3
sample_count = 20
process_count = 5
correctness_oracle = "every warmup and retained sample checks exact text/count/order, ordered-point geometry/confidence, source/envelope/zones/profile, mapping, detector/recognizer work, candidates/memberships/result bytes, ownership, cancellation, heap, growth, and cleanup"
queue_policy = "one synchronous admitted inference, one session pair, two sessions, CPU provider only, no queue or fallback"
producer_surface_copy = "not applicable: immutable CPU replay frames own no producer surface"
notes = "precursor source 180c1b15df1a4c29bd6df14a790b9d18ac831bae; tree 479e4109d39c76adfb745d717648948d060c79b2; executable sha256 6ce1df5bba8bc555fa961af366b0386333e6baeebd7c9483b1be9da39f16c792; schema 4; runtime sha256 68f6e54e695583adc371aef610ec4abb1ffaa3df656582922de7690f7e2000eb; detector sha256 d2a7720d45a54257208b1e13e36a8479894cb74155a5efe29462512d42f49da9; recognizer sha256 6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884; vocabulary sha256 f7aa897ca828a4c7c9e2739c30f9161a33306d532f020bcdb91dcfb664a5507e; no retry or exclusion; rejected final source 7835884 and cache-cold probe remain separate evidence"
benchmark_executable_sha256 = "6ce1df5bba8bc555fa961af366b0386333e6baeebd7c9483b1be9da39f16c792"
final_enforcement_source = "1ad20315e356105dcb8658d9ddcf26c9250eb699"
final_enforcement_tree = "c06a969b0daae212df339b7e3a1bbbdefddf3e5e"
final_enforcement_executable_sha256 = "9d9941e3a14c7acdea71c8c28c4af215a77a7f143d4cc793a53ef2d1d4d3e1da"
deployment_target = "macOS 26.5.2"
cold_load_p95_ms = 86.954
first_close_max_ms = 1.071
reopen_close_max_ms = 63.293
peak_resident_bytes = 464470016
active_cancellation_max_ms = 7.057
retained_result_max_ms = 480.789
rejected_final_cold_open_ms = 149.832
cache_cold_probe_ms = 130.844

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies exact public output and complete singular/grouped resource, ownership, cancellation, and cleanup oracles"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "repeated integrated OCR and result cleanup gives back transient Rust allocations"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 20971520
rationale = "unchanged ADR 0041 20 MiB hard gate; worst precursor peak was 12,695,496 bytes"

[[budget]]
measure = "peak_resident_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 587202560
rationale = "unchanged ADR 0041 Apple final process resident ceiling"

[[budget]]
measure = "cold_load_p95"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 200.0
rationale = "ADR 0045: 1.25 times retained 149.831750 ms cache-state-sensitive final observation, rounded upward to 25 ms"

[[budget]]
measure = "first_close_max"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 2.0
rationale = "unchanged ADR 0041 close ceiling"

[[budget]]
