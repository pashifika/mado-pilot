# Phase 2 native capture, measured on x86_64-pc-windows-msvc at
# implementation tree f02c3e9bc3c08d6faca4f032e6c819376ce5e0db, based on source
# commit 5c7c3b5434c4e5279e9dfc23568de5757914b641.
#
# Produced by `crates/mado-pilot/benches/native-phase2.rs`. ADR 0026 accepts
# this revision-bound Windows profile. Measurement values are the harness
# output. Latency ceilings are three times measured p95, rounded up; memory,
# stale-work, and mapped-byte ceilings are stated below. These are target- and
# fixture-specific regression ceilings, not user-facing latency promises.

format_version = 1

[benchmark]
id = "phase-2-native-capture-x86_64-pc-windows-msvc"
workload = "native steady capture, latest acquisition, and explicit CPU mapping"
phase = "2"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "crates/platform/windows fixture Rust and protocol sources"
fixture_sha256 = "f5acaea836b6eb5257fc7252fdaa2b4d8d6f2d5c0418b6109d956d2b3cd0a279"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF, 12 cores/20 threads, 32 GiB, NVIDIA GeForce RTX 4080"
os_version = "Windows 11 Pro 10.0.26200 (build 26200)"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release"
warmup_iterations = 20
sample_count = 200
correctness_oracle = "every retained sample checks frame identity/content, transition state, receipt/event sequence, or complete common-flow outcome as its measurement states"
queue_policy = "session latest-wins queue depth 1; adapter finite retained-storage limit"
notes = "source base commit 5c7c3b5434c4e5279e9dfc23568de5757914b641, measured implementation tree f02c3e9bc3c08d6faca4f032e6c819376ce5e0db; toolchain rustc 1.97.1 (8bab26f4f 2026-07-14); MSVC 19.44.35228; CMake 3.29.5; OpenCV 4.14.0; GPU/driver NVIDIA GeForce RTX 4080 driver 32.0.15.9186 (2026-01-20); display topology two 2560x1440 logical displays side by side, primary at (0,0), secondary at (-2560,0), GPU reports 3840x2160 at 120 Hz; permissions/signing Windows exposes no separate capture/input permission, unelevated interactive local process, unsigned candidate fixture; fixture path deliberately omitted"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 16777216
rationale = "16 MiB is more than three times the 4684259-byte measured peak and rejects repeated full-frame accumulation"

[[measurement]]
workload = "stimulus_to_frame"
correctness_oracle = "one acknowledged deterministic fixture change produces a newer stamped frame carrying the opposite declared fill; intermediate publications are discarded and counted"
result_correctness = 0
latency_p50_ms = 20.725100
latency_p95_ms = 31.875100
iteration_span_ms = 21.972479
mapped_bytes_per_result = 2322488
stale_work_ratio = 0.000000000
peak_allocated_bytes = 4684259
steady_allocated_bytes = 2361225
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 100.0
  rationale = "three times the measured 31.875100 ms p95, rounded up"

  [[measurement.budget]]
  measure = "mapped_bytes_per_result"
  kind = "absolute"
  unit = "bytes"
  direction = "at_most"
  limit = 2322488
  rationale = "938x619 fixture content at four bytes per pixel, exactly once"

  [[measurement.budget]]
  measure = "stale_work_ratio"
  kind = "absolute"
  unit = "ratio"
  direction = "at_most"
  limit = 0.02
  rationale = "no stale work was measured; the ceiling permits ordinary latest-wins scheduling variation while rejecting more than about four gaps per 200 observations"

[[measurement]]
workload = "latest_acquisition"
correctness_oracle = "after an exact stimulated publication advances the producer, latest returns a same-stream frame no older than that publication and reports the observed sequence gap"
result_correctness = 0
latency_p50_ms = 0.001500
latency_p95_ms = 0.002700
iteration_span_ms = 21.838474
mapped_bytes_per_result = 0
stale_work_ratio = 0.000000000
peak_allocated_bytes = 4678262
steady_allocated_bytes = 2355228
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 0.009
  rationale = "three times the measured 0.002700 ms p95, rounded up"

  [[measurement.budget]]
  measure = "stale_work_ratio"
  kind = "absolute"
  unit = "ratio"
  direction = "at_most"
  limit = 0.02
  rationale = "no stale work was measured; the ceiling catches sustained latest-acquisition sequence loss"

[[measurement]]
workload = "cpu_map_bgra8"
correctness_oracle = "the newer frame maps once to exact-size BGRA8 bytes carrying one declared fixture fill"
result_correctness = 0
latency_p50_ms = 0.968700
latency_p95_ms = 2.140800
iteration_span_ms = 21.168974
mapped_bytes_per_result = 2322488
peak_allocated_bytes = 4678174
steady_allocated_bytes = 2355182
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 8.0
  rationale = "three times the measured 2.140800 ms p95, rounded up"

  [[measurement.budget]]
  measure = "mapped_bytes_per_result"
  kind = "absolute"
  unit = "bytes"
  direction = "at_most"
  limit = 2322488
  rationale = "938x619 fixture content at four bytes per pixel, exactly once"
