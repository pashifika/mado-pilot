# Phase 2.2 controlled-stimulus transitions, measured on aarch64-apple-darwin at source
# 8309a05c3e7696f3081c5afef6dd6979ea1bb084 and tree
# 27fe879e0c4bb55fe4850d9a50737b568936cc10.
#
# Produced by `crates/mado-pilot/benches/native-phase2.rs`. ADR 0029
# accepts this revision-bound run and its pre-measurement qualification
# budgets. These are regression ceilings, not user-facing promises.

format_version = 1

[benchmark]
id = "phase-2-2-controlled-transitions-aarch64-apple-darwin"
workload = "native controlled open, retained-pressure recovery, resize, and close transitions"
phase = "2.2"
status = "measured"
normative = true
measurements_recorded = true
# A committed profile under docs/benchmarks/ carries the budgets.

[profile]
fixture = "separately linked private macOS fixture Rust, protocol-v9, header, Objective-C, and renderer sources"
fixture_sha256 = "474d73530ed02b9060f065fb9df483d0a0e5a647ce14a76eab907b89bbd5f0c6"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release --features private-fixture; signed .app launch"
warmup_iterations = 5
sample_count = 50
correctness_oracle = "every retained sample checks complete frame identity/content, transition state, invocation-only receipt, separate fixture event, diagnostics, or common-flow outcome as its measurement states; a private acknowledgement never substitutes for product delivery or visual progress"
queue_policy = "fixture command queue depth 1; session latest-wins queue depth 1; retained-pressure case fills the reported finite storage limit"
notes = "source commit 8309a05c3e7696f3081c5afef6dd6979ea1bb084, tree 27fe879e0c4bb55fe4850d9a50737b568936cc10; toolchain rustc 1.97.1; Apple clang 21.0.0; macOS SDK 26.5; GPU/driver Apple integrated GPU; system driver stack; display topology three online non-mirrored displays; public frame geometry: 3840x2160 logical/backing 1x at (-3840,109), 2560x1440 logical/5120x2880 backing 2x main at (0,0), 1512x982 logical/3024x1964 backing 2x at (2560,268); mixed 2x/1x signed-origin seam and same-scale 2x/2x seam; permissions/signing Screen Recording granted; event-post access granted; generated fixture bundle ad-hoc signed with approved identifier; fixture executable sha256 d355de10628df7f0c938e4dc72df22b3dc3666997d9e638865b8d624cd6c8ece; executable paths deliberately omitted; lineage=controlled-private-command-transitions; mode=default renderer=appkit-background"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 16777216
rationale = "the retained ADR 0025 ceiling permits one transient resized-frame copy but rejects accumulation"

