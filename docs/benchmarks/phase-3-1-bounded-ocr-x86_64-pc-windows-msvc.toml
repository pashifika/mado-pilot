# Phase 3.1 bounded-detector precursor measured on Core i7-12700KF at exact source
# ce658b3fcbf4ba2a2e715c8d4b98b6f6a2d68235. ADR 0041 fixes the budgets.

format_version = 1

[benchmark]
id = "phase-3-1-bounded-ocr-x86_64-pc-windows-msvc"
workload = "explicit bounded-v2 ONNX CPU OCR 4K, wide, reference, dense, boundary, empty, startup, cleanup, heap, growth, and final process RSS"
phase = "3.1"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "fixtures/ocr/g-004 fixture-manifest.json and its five SHA-256-bound PNGs plus derived deterministic frames"
fixture_sha256 = "a289edb167d45f11f4269cef22ff37d93d2cbe1150201afb9bb3f58439375c4b"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF, 12 cores/20 logical processors, 32 GiB class"
os_version = "Windows 11 Pro 25H2 build family 26200"
build_profile = "cargo bench, default features, debug_assertions=false; five fresh alternating-order bounded processes"
warmup_iterations = 3
sample_count = 20
process_count = 5
correctness_oracle = "every warmup and retained sample checks exact text/count/order, fixed fixture geometry/confidence, source/profile identity, detector plan, mapping, runs, sessions, cancellation, heap, growth, and cleanup"
queue_policy = "one synchronous admitted inference, one session pair, two sessions, CPU provider only, no queue or fallback"
producer_surface_copy = "not applicable: immutable CPU replay frames own no producer surface"
notes = "precursor source ce658b3fcbf4ba2a2e715c8d4b98b6f6a2d68235; tree b806af16f228fa8a630f65c0db0ab99c682a67d3; executable sha256 54a10f73970e24e126b4863853c0949610206bb7135579477883ec669ea0b5ed; schema 3; runtime archive sha256 c9b4b7086b529ad814f428c1bad028e20a25d7dc0699836775faace4ab5b78b2; runtime DLL sha256 69d8e6d3879a3b4001cdc74c8ed9ccc7e7f799a5b847059738323404519ec471; detector sha256 d2a7720d45a54257208b1e13e36a8479894cb74155a5efe29462512d42f49da9; recognizer sha256 6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884; vocabulary sha256 f7aa897ca828a4c7c9e2739c30f9161a33306d532f020bcdb91dcfb664a5507e; no retry or exclusion; workload RSS fields are cumulative process high-water checkpoints and only final report RSS sets the budget"
benchmark_executable_sha256 = "54a10f73970e24e126b4863853c0949610206bb7135579477883ec669ea0b5ed"
deployment_target = "Windows 11 Pro 25H2 build family 26200"
cold_load_p95_ms = 183.501
first_close_max_ms = 4.673
reopen_close_max_ms = 155.030
peak_resident_bytes = 228741120

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its text, geometry, order, confidence, source-correlation, and exact resource oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "repeated bounded OCR and result cleanup gives back transient Rust allocations"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 20971520
rationale = "unchanged 20 MiB hard gate; worst precursor peak was 12,695,272 bytes"

[[budget]]
measure = "peak_resident_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 301989888
rationale = "1.25 times the 228,741,120-byte final process high-water, rounded upward to 16 MiB"

[[budget]]
measure = "cold_load_p95"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 250.0
rationale = "1.25 times the 183.501 ms worst precursor cold open, rounded upward to 25 ms"

[[budget]]
measure = "first_close_max"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 8.0
rationale = "1.5 times the 4.673 ms worst first close, rounded upward to 1 ms"

[[budget]]
