# Phase 4 deterministic template-watch precursor measured on the approved aarch64-apple-darwin host.
# ADR 0051 fixes target-specific budgets; final enforcement identities are added after the fresh final cohort.

format_version = 1

[benchmark]
id = "phase-4-template-watch-query-aarch64-apple-darwin"
workload = "deterministic Rust replay/OpenCV watcher plus controlled scheduler oracles"
phase = "4"
status = "invalidated"
normative = false
measurements_recorded = true

[profile]
fixture = "fixtures/assets/phase1-slice and mado-pilot-testkit deterministic scenes"
fixture_sha256 = "f6a4a3c3a47096c97d50e05c0a0d0bb93a764c159770aa01face22e4dbd2c2a9"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 CPU cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo build --locked --release --package mado-pilot --bench template-watch-query; debug_assertions=false; five fresh sequential processes"
warmup_iterations = 3
sample_count = 20
process_count = 5
correctness_oracle = "every retained sample checks exact source, match, state, observed work/lifecycle outcomes, ownership, and producer progress"
queue_policy = "fixed scheduler descriptor: 256 engine queries, 16 active sessions, 64 queries per session, two analyses, one latest pending frame per query"
producer_surface_copy = "not applicable: immutable replay and controlled CPU frames own no producer surface"
notes = "precursor source bef47a647693d07c88ef52a55620fd55d7e50f12; tree 485b586d48d193c0c1974af89e84b73ebce88dab; executable sha256 a5f3c6fd64854873aac5a3032b95d2f6b6e5d8b47de19ae06722a6b3ff368cc5; OpenCV 4.14.0; direct gated progress/backend/publication/typed-outcome work observation; exact v1/v2 failures remain Change evidence; no retry or exclusion"
benchmark_executable_sha256 = "a5f3c6fd64854873aac5a3032b95d2f6b6e5d8b47de19ae06722a6b3ff368cc5"
final_enforcement_source = "9141c7cf77709a6cae39718d0fec721309324172"
final_enforcement_tree = "5b102569c59240a060fccb314794dc5becd703ff"
final_enforcement_executable_sha256 = "7f657114aadf1341d10eed48d3bbc6063ab2e4d9ccc936b05586eb5d9660845d"
final_enforcement_process_count = 5
peak_resident_bytes = 54804480

