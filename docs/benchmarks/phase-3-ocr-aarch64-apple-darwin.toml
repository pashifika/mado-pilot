# Phase 3 accepted CPU OCR profile measured on Apple M1 Pro at review-fixed source
# e41fbbd5457d5f9c10da55982a799c608ccc195e and tree
# 9fbc47ef0698047aaab5c51e3616712e87ae9b08. Windows ceilings remain withheld.

format_version = 1

[benchmark]
id = "phase-3-ocr-aarch64-apple-darwin"
workload = "accepted ONNX CPU OCR cold startup, full frame, bounded region, empty result, allocation growth, and cleanup"
phase = "3"
status = "measured"
normative = true
measurements_recorded = true
# A committed profile under docs/benchmarks/ carries the budgets.

[profile]
fixture = "fixtures/ocr/g-004/hud.png plus a synthetic 64x64 packed BGRA empty frame"
fixture_sha256 = "10f0163cf298453e55922cc6104ee3066f59a328a55e9bac6c04f24d36c9e288"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo bench, default features, debug_assertions=false; five fresh processes"
warmup_iterations = 3
sample_count = 20
process_count = 5
correctness_oracle = "every warmup and retained sample checks exact NFC text/count/order, fixture-derived geometry bounds, finite same-host-stable confidence, frame/effective-region/output/backend/model correlation, exact empty outcome, and no late publication"
queue_policy = "one synchronous admitted inference, one session pair, two sessions, CPU provider only, intra/inter operation threads 1, CPU arena disabled, recognition batch ceiling 6"
producer_surface_copy = "not applicable: the profile maps immutable CPU replay frames and owns no producer/native surface; no copied-byte ceiling is set"
notes = "source commit e41fbbd5457d5f9c10da55982a799c608ccc195e; tree 9fbc47ef0698047aaab5c51e3616712e87ae9b08; rustc/cargo 1.97.1; OpenCV 4.14.0; runtime profile onnxruntime-1.29.0-api17-cpu; runtime sha256 5039a93886b71ddfcf62912a2be5b357cf51fa9a6579ad9302c78323f5f7c302; detector sha256 d2a7720d45a54257208b1e13e36a8479894cb74155a5efe29462512d42f49da9; recognizer sha256 6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884; vocabulary 18708 entries sha256 f7aa897ca828a4c7c9e2739c30f9161a33306d532f020bcdb91dcfb664a5507e; mapped and inference/session counts observed in-process; peak RSS enforced through getrusage; no failed-sample exclusion or retry"
benchmark_executable_sha256 = "fd8713672094be22d4e55a1dd23a4ee23ef75632f779c93ddb5956b077992e48"
deployment_target = "macOS 26.5.2"
cold_load_p95_ms = 87.377
first_close_max_ms = 1.163
reopen_close_max_ms = 64.929
peak_resident_bytes = 516833280

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its text, geometry, order, confidence, source-correlation, and resource oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "repeated OCR and result cleanup gives back transient Rust allocations"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 20971520
rationale = "20 MiB is 1.48 times the 14,149,992-byte worst precursor workload peak"

[[budget]]
measure = "peak_resident_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 805306368
rationale = "768 MiB is 1.47 times the 548,487,168-byte five-process precursor high-water"

[[budget]]
measure = "cold_load_p95"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 175.0
rationale = "1.23 times the retained 141.686 ms post-instrumentation first-process failure and 2.01 times the 86.988 ms precursor maximum, rounded up"

[[budget]]
measure = "first_close_max"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 2.0
rationale = "1.79 times the 1.116 ms worst first close, rounded up"

[[budget]]
measure = "reopen_close_max"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 100.0
rationale = "1.57 times the 63.569 ms worst accepted-model reopen and close, rounded up"

[[budget]]
measure = "max_tensor_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
