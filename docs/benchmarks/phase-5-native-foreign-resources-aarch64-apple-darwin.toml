queue_policy = "unchanged finite native watcher protocol; one outstanding request, 64 reader events, 2048-byte wire lines, 64 facts per row, 512 records per process"
controller_boundary = "separate fixed post-warmup equality predicate; historical Windows count 241 is not a future hard-coded baseline; cold controller observations are diagnostic"
geometry_stages = ["F2/F3 and F4 before", "F4 after and F5 before", "F5 after"]
frame_extents = [[1280, 904], [1376, 968], [688, 484]]
