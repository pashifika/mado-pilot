release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
deployment_target = "macOS 26.5.2"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release --features private-fixture; signed .app; controlled NSWorkspace new-instance launch"
warmup_iterations = 20
sample_count = 200
correctness_oracle = "every retained sample checks production frame identity, frame-authoritative geometry, declared fixture content, finite retained progress, exact mapping, or bounded lifecycle outcome; the resize command is stimulus only and never substitutes for a captured result"
queue_policy = "session latest-wins queue depth 1; adapter finite retained-storage limit; no input stimulus"
notes = "source commit d182300cd8710891ded6cba17184c44d6d58a114, tree c570343d334a5c77415e6a885ef8821c731b0ad5; toolchain rustc 1.97.1; cargo 1.97.1; Apple clang 21.0.0; macOS SDK 26.5; GPU/driver Apple integrated GPU; system driver stack; display topology exactly two online non-mirrored displays; signed-origin 3840x2160 1x; main 2560x1440 logical / 5120x2880 backing 2x; mixed-scale connection method unrestricted; permissions/signing Screen Recording granted; event-post access granted; target bundle structurally ad-hoc signed; fixture executable sha256 40a33a5ceefff9ff01afef52b694799d2a1af91cc355a9d1020dda2a68891374; executable paths deliberately omitted; benchmark and fixture SHA-256 bytes are bound to validity-checked static and audit-token-selected live Security code identities; lineage=production-capture-publication; mode=default renderer=appkit-background stimulus=none"

