format_version = 1

[benchmark]
id = "phase-2-production-capture-aarch64-apple-darwin"
workload = "macOS production capture publication age, acquisition, mapping, and retained progress"
phase = "2"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "separately linked private macOS fixture Rust, protocol-v11, header, Objective-C, and renderer sources"
