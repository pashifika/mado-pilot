warmup_iterations = 5
sample_count = 50
correctness_oracle = "every retained sample checks complete frame identity/content, transition state, invocation-only receipt, separate fixture event, diagnostics, or common-flow outcome as its measurement states; a private acknowledgement never substitutes for product delivery or visual progress"
queue_policy = "one fixture command outstanding; one process-directed sequence admitted; no fallback"
notes = "source commit f412227d8fbe13de3f049f9631bbe9e6a8ac9bd8, tree 75cf27dd8258384b3e01cdb3063bbe81ce0db6d9; toolchain rustc 1.97.1; cargo 1.97.1; Apple clang 21.0.0; macOS SDK 26.5; GPU/driver Apple integrated GPU; system driver stack; display topology three online non-mirrored displays; DELL 3840x2160 1x at negative origin; MSI 2560x1440 2x main; Color LCD 1512x982 logical / 3024x1964 backing 2x; mixed-scale validator authoritative; permissions/signing Screen Recording granted; event-post access granted; target and foreground bundles structurally ad-hoc signed; fixture executable sha256 63a853007e654e7c6781a3cadf10521dbe60623cdaa0aed83da8fbc7f609e165; executable paths deliberately omitted; lineage=process-directed-appkit; mode=default renderer=appkit-background"

