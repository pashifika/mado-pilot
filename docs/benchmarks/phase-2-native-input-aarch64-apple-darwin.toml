# Phase 2 native input and public-language common flows, measured on
# aarch64-apple-darwin at source de0c8470ea08a1320a44ed15e348783a0abf7ab6
# and tree 9da11c77b354ead0088055d01e40bfd1e62d80ba.
#
# Produced by `crates/mado-pilot/benches/native-phase2.rs`. ADR 0025 accepts
# this revision-bound replacement for the input profile invalidated by ADR 0021.
# Measurement values are the harness output. Latency ceilings are three times
# measured p95, rounded up; memory and mapped-byte ceilings are stated below.
# These are target- and fixture-specific regression ceilings, not user-facing
# latency promises.

format_version = 1

[benchmark]
id = "phase-2-native-input-aarch64-apple-darwin"
workload = "native input and the public Rust common flow"
phase = "2"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "crates/platform/macos fixture Rust, protocol, header, and Objective-C sources"
fixture_sha256 = "c8a14353ebd3732ba82895b85b877b5f03f623925ffa0d8b1b9d48383d06fda1"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release"
warmup_iterations = 5
sample_count = 50
correctness_oracle = "every retained sample checks frame identity/content, transition state, receipt/event sequence, or complete common-flow outcome as its measurement states"
queue_policy = "session latest-wins queue depth 1; bounded input sequence executes serially"
notes = "source commit de0c8470ea08a1320a44ed15e348783a0abf7ab6, tree 9da11c77b354ead0088055d01e40bfd1e62d80ba; toolchain rustc 1.97.1 (8bab26f4f 2026-07-14); C/C++ Apple clang 21.0.0; GPU/driver Apple integrated GPU; system driver stack; display topology one built-in 3024x1964 Retina display at scale 2; permissions/signing Screen Recording granted; Accessibility granted; generated fixture bundle ad-hoc signed with approved identifier; fixture path deliberately omitted; C/C++ peak_allocated_bytes counts only harness-side Rust allocations, while peak_resident_bytes is the child process peak reported by the native OS after owned-handle cleanup"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 16777216
rationale = "16 MiB is more than three times the 4635805-byte measured Rust input-request peak"

[[measurement]]
workload = "input_request_receipt"
correctness_oracle = "the complete two-event receipt corresponds to exactly one fixture key-down and key-up summary"
