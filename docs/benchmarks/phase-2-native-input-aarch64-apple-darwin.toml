# Phase 2 native input and public-language common flows, measured on
# aarch64-apple-darwin at source a1faf04505c8471deb4de8c136fddcc7f76105e7
# and tree a6a3edd6e627eadc9da76785c861136d669e8b05.
#
# Produced by the historical `crates/mado-pilot/benches/native-phase2.rs`.
# ADR 0020 records that run and its retained rejected attempt; ADR 0021
# invalidates the profile for the current tree after source drift, input
# liveness, and correctness-oracle repairs. The measurements and former budgets
# remain reviewable evidence, not current regression ceilings.

format_version = 1

[benchmark]
id = "phase-2-native-input-aarch64-apple-darwin"
workload = "native input and the public Rust common flow"
phase = "2"
status = "historical-invalidated-source-and-oracle-drift"
normative = false
measurements_recorded = true

[profile]
fixture = "crates/platform/macos fixture Rust, protocol, header, and Objective-C sources"
fixture_sha256 = "1140bae43512909daacc4f7f3ac83a70ff4cb39b7d45bafb17ae7f6518836932"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 CPU cores, 32 GiB"
os_version = "macOS 26.5.2 build 25F84"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release"
warmup_iterations = 5
sample_count = 50
correctness_oracle = "every retained sample checks frame identity/content, transition state, receipt/event sequence, or complete common-flow outcome as its measurement states"
queue_policy = "session latest-wins queue depth 1; bounded input sequence executes serially"
notes = "source commit a1faf04505c8471deb4de8c136fddcc7f76105e7, tree a6a3edd6e627eadc9da76785c861136d669e8b05; toolchain rustc 1.97.1 (8bab26f4f 2026-07-14); C/C++ Apple clang 21.0.0; GPU/driver Apple integrated GPU; system driver stack; display topology one built-in 3024x1964 Retina display at scale 2; permissions/signing Screen Recording granted; Accessibility granted; generated fixture bundle ad-hoc signed with approved identifier; fixture path deliberately omitted; C/C++ peak_allocated_bytes counts only harness-side Rust allocations, while peak_resident_bytes is the child process peak reported by the native OS after owned-handle cleanup"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 16777216
rationale = "16 MiB is more than three times the 4635854-byte measured Rust common-flow peak"

[[measurement]]
workload = "input_request_receipt"
correctness_oracle = "the complete two-event receipt corresponds to exactly one fixture key-down and key-up summary"
result_correctness = 0
latency_p50_ms = 13.676500
latency_p95_ms = 15.064084
iteration_span_ms = 16.659377
mapped_bytes_per_result = 0
peak_allocated_bytes = 7548
steady_allocated_bytes = 7086
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 50.0
  rationale = "three times the measured 15.064084 ms, rounded up"

