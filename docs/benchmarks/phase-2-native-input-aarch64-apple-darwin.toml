# Phase 2 macOS native input and released-language common flow, measured on
# aarch64-apple-darwin at source dec43d7b6c91d415f2028e188e89fa289cb9c1c9
# and tree 109f77df9ef9f40b515245ab60a6036822ee7d78.

format_version = 1

[benchmark]
id = "phase-2-native-input-aarch64-apple-darwin"
workload = "native Rust System input plus released C and C++ ProcessDirected common flows"
phase = "2"
status = "measured"
normative = true
measurements_recorded = true
# A committed profile under docs/benchmarks/ carries the budgets.

[profile]
fixture = "separately linked private macOS fixture Rust, protocol-v11, header, Objective-C, and renderer sources"
fixture_sha256 = "c5576c5290003c723f1d3797ab1c6032e935a9e04ab42d50ce5dc9108bc029ea"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release --features private-fixture; signed .app; controlled NSWorkspace new-instance launch"
warmup_iterations = 5
sample_count = 50
correctness_oracle = "every retained sample checks complete frame identity/content, transition state, invocation-only receipt, separate fixture event, diagnostics, or common-flow outcome as its measurement states; a private acknowledgement never substitutes for product delivery or visual progress"
queue_policy = "session latest-wins queue depth 1; Rust System and C/C++ explicit ProcessDirected sequences execute serially with no fallback"
notes = "source commit dec43d7b6c91d415f2028e188e89fa289cb9c1c9, tree 109f77df9ef9f40b515245ab60a6036822ee7d78; toolchain rustc 1.97.1; cargo 1.97.1; Apple clang 21.0.0; macOS SDK 26.5; GPU/driver Apple integrated GPU; system driver stack; display topology three online non-mirrored displays; signed-origin display 3840x2160 1x; main display 2560x1440 logical / 5120x2880 backing 2x; built-in display 1512x982 logical / 3024x1964 backing 2x; mixed-scale validator authoritative; permissions/signing Screen Recording granted; event-post access granted; target and foreground bundles structurally ad-hoc signed; fixture executable sha256 18a14299de1a2cbb6d26e1aa9f37c1708c1a25ec9a32413e4cc730f3cfa761bc; C executable sha256 12d4c23d7788973efd01b5257e8352c45b73221088fd6257a7b6c08b94428819; C++ executable sha256 4651243160c3845427011f83480ac81197a1a61cb92fa6631cf437f0d6b8da42; MadoPilot dynamic library sha256 e7f42b208522ff772fa67449f52ba7ef33350e535788a29f4876c171a5bf6898; executable paths deliberately omitted; benchmark and fixture SHA-256 bytes are bound to validity-checked static and live Security code identities; each C/C++ program retains unique executable and library pins inside controller-owned mode-0500 directories, every spawned child must match the executable pin's live code identity, and both directory/file identities and bytes are rechecked after each exit; C/C++ peak_allocated_bytes counts only harness-side Rust allocations, while peak_resident_bytes is the child process peak reported by the native OS after owned-handle cleanup; each C/C++ child has a 5 s execution bound, a 1 s termination/reap allowance, and a 65536-byte stdout/stderr cap per stream; lineage=rust-System-unchanged-cross-language-ProcessDirected-cutover; mode=default renderer=appkit-background"
benchmark_executable_sha256 = "fa4ac54a1fa9df3e25833c7923cf7b24dc5ee82a70ddff9a3aa3033a73f5ce08"
deployment_target = "macOS 26.5.2"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 16777216
rationale = "16 MiB is more than three times the 4635847-byte measured Rust input-request peak"

