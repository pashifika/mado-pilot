# Phase 2.2 controlled-stimulus capture, measured on aarch64-apple-darwin at source
# a4b12ffb89e0ef5e70ddf229a258c74dbe74a9dd and tree
# f928a7059b47ce5b8e2dbdd970317c0e5e4c1b90.
#
# Produced by `crates/mado-pilot/benches/native-phase2.rs`. ADR 0029
# accepts this revision-bound run and its pre-measurement qualification
# budgets. These are regression ceilings, not user-facing promises.

format_version = 1

[benchmark]
id = "phase-2-2-controlled-capture-aarch64-apple-darwin"
workload = "native controlled capture, static retention, latest acquisition, and explicit CPU mapping"
phase = "2.2"
status = "measured"
normative = true
measurements_recorded = true
# A committed profile under docs/benchmarks/ carries the budgets.

[profile]
fixture = "separately linked private macOS fixture Rust, protocol-v9, header, Objective-C, and renderer sources"
fixture_sha256 = "474d73530ed02b9060f065fb9df483d0a0e5a647ce14a76eab907b89bbd5f0c6"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release --features private-fixture; signed .app launch"
warmup_iterations = 20
sample_count = 200
correctness_oracle = "every retained sample checks complete frame identity/content, transition state, invocation-only receipt, separate fixture event, diagnostics, or common-flow outcome as its measurement states; a private acknowledgement never substitutes for product delivery or visual progress"
queue_policy = "fixture command queue depth 1; session latest-wins queue depth 1; adapter finite retained-storage limit"
notes = "source commit a4b12ffb89e0ef5e70ddf229a258c74dbe74a9dd, tree f928a7059b47ce5b8e2dbdd970317c0e5e4c1b90; toolchain rustc 1.97.1; Apple clang 21.0.0; macOS SDK 26.5; GPU/driver Apple integrated GPU; system driver stack; display topology three online non-mirrored displays; public frame geometry: 3840x2160 logical/backing 1x at (-3840,109), 2560x1440 logical/5120x2880 backing 2x main at (0,0), 1512x982 logical/3024x1964 backing 2x at (2560,268); mixed 2x/1x signed-origin seam and same-scale 2x/2x seam; permissions/signing Screen Recording granted; event-post access granted; generated fixture bundle ad-hoc signed with approved identifier; fixture executable sha256 d355de10628df7f0c938e4dc72df22b3dc3666997d9e638865b8d624cd6c8ece; executable paths deliberately omitted; lineage=controlled-private-command-capture; mode=default renderer=appkit-background"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 33554432
rationale = "the retained ADR 0025 ceiling rejects an added accumulation of full-frame storage"

