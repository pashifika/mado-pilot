deployment_target = "Windows 11 25H2 build family 26200"
build_profile = "cargo bench, default features; platform/windows benchmark-instrumentation dev feature; debug_assertions=false; fixture cargo build --release"
warmup_iterations = 1
sample_count = 3
correctness_oracle = "every retained sample checks exact 1280x720 production startup, finite retained-pressure recovery, frame-authoritative resize recreation, typed target-loss and replacement recovery, or bounded idempotent close"
queue_policy = "WGC producer pool depth 2; session latest-wins queue depth 1; finite retained storage; 16 ms repaint timer; one bounded pointer resize stimulus"
notes = "source commit 7c31752bc632a26c4ba61faa0567ac78e2218ea0, tree 4e99487e184b3edfcbd62e31299599d2fbe13c7d; toolchain rustc 1.97.1; cargo 1.97.1; MSVC 19.44.35228; Windows SDK 10.0.26100.0; OpenCV 4.14.0; GPU/driver NVIDIA GeForce RTX 4080, driver 32.0.15.9186; display topology one online non-mirrored primary; 3840x2160 physical; 2560x1440 logical; 144 DPI; signed rectangle [0,0,3840,2160); permissions/signing unelevated interactive desktop; unsigned repository fixture; Windows exposes no separate capture permission; fixture executable sha256 93f60dde8c469e188a467b6f122d91d8295c07de11c000a8f7cb26626a1f2ec0; executable paths deliberately omitted"
[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
