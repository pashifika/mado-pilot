# Phase 2 Windows dual-4K production capture, requalified on shared-oracle source
# f50285a630b07dcf10a675a0e94d34a735aa163c and tree
# 4c2f23f851669932dee304e46d2c947721598549. Earlier runs retain their
# historical oracle and source identities in evidence.

format_version = 1

[benchmark]
id = "phase-2-production-capture-dual-4k-x86_64-pc-windows-msvc"
workload = "Windows dual-4K mixed-DPI production capture, cross-seam movement, callback detachment, mapping, and dual-session pressure"
phase = "2"
status = "measured"
normative = true
measurements_recorded = true
# A committed profile under docs/benchmarks/ carries the budgets.

[profile]
fixture = "crates/platform/windows fixture Rust and protocol sources"
fixture_sha256 = "5a0513e46df67ad3b279d18584d83bb620d14ce9bc828f39bfcaa7e4a992fe5b"
benchmark_executable_sha256 = "9e1e0b4255f00c8567ad6714311e66f71f58c6c666a94db33ab3662e50d01010"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF, 32 GiB RAM, NVIDIA GeForce RTX 4080"
os_version = "Windows 11 Pro 25H2 build 26200.9168"
deployment_target = "Windows 11 25H2 build family 26200"
build_profile = "cargo bench, default features; platform/windows benchmark-instrumentation dev feature; debug_assertions=false; fixture cargo build --release"
warmup_iterations = 20
sample_count = 600
correctness_oracle = "every retained sample checks strictly newer topology-qualified production frames, exact BGRA8 mapping and declared fixture content, callback-copy accounting, finite retained progress, or observable latest-wins pressure"
queue_policy = "two WGC producer pools depth 2; two session latest-wins queues depth 1; shared Adapter retained-byte budget; fixture 16 ms repaint timer"
notes = "source commit f50285a630b07dcf10a675a0e94d34a735aa163c, tree 4c2f23f851669932dee304e46d2c947721598549; toolchain rustc 1.97.1; cargo 1.97.1; MSVC 19.44.35228; Windows SDK 10.0.26100.0; OpenCV 4.14.0; GPU/driver NVIDIA GeForce RTX 4080, driver 32.0.15.9186; display topology exactly two online non-mirrored 3840x2160 displays; primary 144 DPI scale 1.5 at [0,0,3840,2160); secondary 120 DPI scale 1.25 at [-3840,0,0,2160); signed-origin seam; permissions/signing unelevated interactive desktop; unsigned repository fixture; Windows exposes no separate capture permission; fixture executable sha256 725dcced8b71c0f5d9f875559594f17005495c5873d4c6a6efbf709056e7f073; executable paths deliberately omitted"
[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 402653184
rationale = "ADR 0032 permits more than three times the largest measured dual-4K live Rust heap peak"

[[budget]]
measure = "peak_resident_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 1073741824
rationale = "ADR 0032 rounds above three times the largest measured native benchmark process resident peak"

[[measurement]]
workload = "dual_display_frame_arrival"
correctness_oracle = "one strictly newer frame arrives from each topology-qualified 4K display while the deterministic fixture straddles their signed-origin seam; both exact mappings carry declared fixture content"
