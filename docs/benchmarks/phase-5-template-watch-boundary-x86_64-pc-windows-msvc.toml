# Original reports, failures, source identities and arrays remain unchanged.
format_version = 1

[benchmark]
id = "phase-5-template-watch-boundary-x86_64-pc-windows-msvc"
workload = "paired public Rust-facade and negotiated C-table query observation costs"
phase = "5"
status = "precursor-measured-budgets-accepted"
normative = true
measurements_recorded = true
normative_scope = "accepted target-local numeric limits only; recorded observations are precursors, not final qualification results"

[profile]
fixture = "fixtures/assets/phase1-slice; generated match_fixtures RGBA scene; two-frame rate-held absent and one-frame matched replay"
fixture_sha256 = "293050009da09f14f272919e3df33738c138a26863948309736303db9fc04492"
scene_rgba_sha256 = "f64b1df743b1204cf70f459866371602ffbd99b1cee383e38837c562b2889aa2"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF"
os_version = "Windows 11 Pro 10.0.26200"
build_profile = "template-watch-boundary; debug_assertions=false; private-fixture=false; coreml-provider=false; cuda-provider=false; qualification-unsupported-api=false"
metric_schema = "phase-5-template-watch-boundary-v2"
warmup_iterations = 20
sample_count = 200
process_count = 4
precursor_workload_count = 18
required_workload_count = 18
process_policy = "four source-bound precursor processes for the original sixteen rows; two complete source-bound processes for lifecycle rows; all 200 samples retained per workload/process; no pooling, exclusion, replacement or retry"
correctness_oracle = "every warmup and retained observation checks its unchanged consumer oracle; structural zero-allocation gates inspect every caller window"
queue_policy = "two-frame rate-held absent replay or one-frame matched replay; fixed finite scheduler and unchanged settled pending snapshot"
latency_scope = "original sixteen observation rows: one batch including fixed-value oracle comparisons and transient reference release, excluding replay/engine/package/template setup, matching wait and parent close; create_cancel_release rows instead time the full replay lifecycle; report storage and output are always outside"
first_terminal_scope = "one first poll and its owned result publication only; SessionClosed is committed by public close before the window; result oracle and release are after the window; no matched-backend completion is timed"
deadline_scope = "finite operation authority, not preemption of an uninterruptible backend or a hard wall-clock guarantee; poll, retain, release and value access use their public nonblocking/bounded lifecycle contracts"
allocation_scope = "caller-thread Rust GlobalAlloc calls only; includes alloc, alloc_zeroed and every realloc (even a same-size or shrinking call); excludes other threads, foreign malloc and independently loaded libraries"
heap_scope = "process-wide live Rust heap via existing Accounting, including fixture and concurrent workers; peak/growth use shared harness baselines; first-terminal rows also include per-sample untimed setup/teardown in heap and iteration_span"
mapped_bytes_scope = "not instrumented: no mapped_bytes_per_result or extra-mapped-byte assertion; unchanged pending authority is observed, not a byte measurement; retained-frame rows report actual readable mapping length and check shared-storage flags in their oracle"
steady_heap_scope = "ending caller-recorded process live Rust bytes minus pre-fixture baseline, saturated at zero; fixture retained except first-terminal and full-lifecycle per-sample teardown; distinct from each signed lifecycle live-after minus live-before sample"
resident_memory_scope = "unavailable: Rust GlobalAlloc is not process RSS, native heap, foreign malloc or GPU memory"
startup_scope = "native capture startup unavailable; lifecycle rows measure replay startup-through-close including package preparation, not native session-open to frame readiness"
lifecycle_scope = "create_cancel_release rows alone include one full replay setup, settled pending oracle, Cancelled publication, result/query final release and session/engine/caller teardown per sample; live before/after readings surround that entire window, with no post-teardown wait for a chosen heap value"
abi_overhead_scope = "paired absolute Rust and negotiated C-table costs in one Rust-linked process, not independent C++/dynamic-library/foreign-allocator costs; no subtractive or ratio gate"
setup_operation_timeout_nanos = 5000000000
query_lifetime_nanos = 60000000000
pending_minimum_interval_nanos = 3600000000000
historical_precursor_workload_count = 16
complete_precursor_process_count = 2
lifecycle_source_bound_process_count = 2

[acceptance]
status = "accepted"
independent_review = "rasen/changes/pull-based-c-and-cpp-template-watch-query/evidence/windows-boundary-acceptance-001.json"
adr = "docs/adr/0068-template-watch-boundary-budgets.md"
final_enforcement = "not run; requires a clean pinned final source/executable and five fresh sequential full enforcement processes on this exact target/host; precursors do not count; no retry, replacement, exclusion or CLI override"
native_support = "not implied"
date = "2026-09-07"
accepted_workload_count = 18
final_enforcement_process_count = 0
native_f9_os_resource_budgets = "unaccepted"

[derivation]
latency = "for each target/workload/statistic: 2 * max(applicable source-bound per-process nearest-rank raw-nanosecond statistic), rounded upward to 100 ns"
latency_quantum_nanos = 100
latency_headroom_numerator = 2
latency_headroom_denominator = 1
heap = "for each target/workload/peak-or-steady metric: 1.25 * max(applicable source-bound per-process bytes), rounded upward to 4096 bytes; an observed zero stays zero"
heap_quantum_bytes = 4096
heap_headroom_numerator = 5
heap_headroom_denominator = 4
allocations = "maximum source-bound observed caller alloc + alloc_zeroed + realloc per complete sample; no allowance, dealloc subtraction or conversion from net heap"
growth = "signed post-warmup allocated growth at most zero for every workload; opt-in accepted ceiling, not the inherited Phase 1 4096-byte hard gate"
limits = "four source-bound processes for original rows, two for lifecycle; no confidence interval or long-tail guarantee; actual zero-duration first polls reflect clock granularity; keep every outlier"
final_campaign = "after independent acceptance and candidate pinning, five fresh sequential full enforcement processes per target, retaining every attempted process and full raw output; no final result selects or relaxes a ceiling"
nearest_rank_one_based = [100, 190, 200]
lifecycle_live_delta = "every retained signed process_live_bytes_after_window - process_live_bytes_before_window sample <= 0; not an average, sum or saturated difference"
measurement_summary = "measurement statistics are worst applicable source-bound per-process observations; budget records are accepted limits, never measured values"
source_bound_precursors = ["windows-first", "windows-repeat", "windows-001", "windows-002"]
lifecycle_source_bound_precursors = ["windows-001", "windows-002"]

