# Phase 2.2 diagnostic overhead, remeasured on x86_64-pc-windows-msvc at
# implementation tree 2483269ee071d14adfe14f829d318a4c59337f85, source commit
# 6873d4b05a13fd15cb3ffd961892b1153f606d78.
#
# Produced by `crates/automation/runtime/benches/diagnostic-overhead.rs`:
#
#   cargo bench --locked --package mado-pilot-runtime --bench diagnostic-overhead -- \
#       --hardware "Intel Core i7-12700KF, 12 cores/20 threads, 32 GiB" \
#       --os-version "Windows 11 Pro 10.0.26200 (build 26200)"
#
# Measurement values are the post-review harness output. ADR 0026 keeps the
# accepted latency ceilings unchanged; their individual rationales describe the
# baseline derivation. The 32 KiB live-Rust-heap ceiling remains structural.
# These are target- and fixture-specific regression ceilings, not promises.

format_version = 1

[benchmark]
id = "phase-2-input-diagnostic-overhead-x86_64-pc-windows-msvc"
workload = "capture/mapping, input submission, and close/drain with diagnostics off, enabled, and under bounded pressure"
phase = "2.2"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "source-defined controlled capture/input fixture in crates/automation/runtime/benches/diagnostic-overhead.rs"
fixture_sha256 = "42e3133b63bcdc2f905eead2b52a4ac9ba97571da4580ef2c90feb9520398891"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF, 12 cores/20 threads, 32 GiB"
os_version = "Windows 11 Pro 10.0.26200 (build 26200)"
build_profile = "cargo bench, default features, debug_assertions=false"
warmup_iterations = 20
sample_count = 200
correctness_oracle = "every retained sample checks exact frame/mapping or receipt outcomes, exact diagnostic categories, queue losses, and increasing record sequences"
queue_policy = "diagnostics Off has no queue; Normal and Debug use capacity 64; overflow uses capacity 4; producer emission is non-blocking and every sample drains"
notes = "input spans time submission/emission; capture spans acquisition/mapping/emission; close spans explicit close plus one diagnostic drain. Oracle checks follow each span. Source commit 6873d4b05a13fd15cb3ffd961892b1153f606d78, tree 2483269ee071d14adfe14f829d318a4c59337f85. ADR 0026 ceilings retain their accepted baseline derivation and are not recalibrated by this rerun."

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained frame, mapping, receipt, and diagnostic batch satisfies its workload oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "repeated capture, mapping, submission, close, and drain return transient allocations"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 32768
rationale = "32 KiB bounds queue and per-case storage; the current largest measured fixture peak is 16787 bytes"

[[measurement]]
workload = "input_submission_diagnostics_off"
correctness_oracle = "the complete receipt is unchanged and no diagnostic reader exists"
result_correctness = 0
latency_p50_ms = 0.000400
latency_p95_ms = 0.000400
iteration_span_ms = 0.000483
mapped_bytes_per_result = 0
peak_allocated_bytes = 5244
steady_allocated_bytes = 5179
allocated_growth_bytes = 0

  [[measurement.budget]]
  measure = "latency_p95"
  kind = "absolute"
  unit = "milliseconds"
  direction = "at_most"
  limit = 0.0012
  rationale = "three times the measured 0.000400 ms p95"

[[measurement]]
workload = "input_submission_diagnostics_normal"
correctness_oracle = "the complete receipt is unchanged and exactly its one normal record drains without loss"
result_correctness = 0
latency_p50_ms = 0.000500
latency_p95_ms = 0.000600
iteration_span_ms = 0.000895
mapped_bytes_per_result = 0
peak_allocated_bytes = 16467
steady_allocated_bytes = 15619
allocated_growth_bytes = 0

