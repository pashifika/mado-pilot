# Phase 3.1 bounded-detector precursor measured on Apple M1 Pro at exact source
# ce658b3fcbf4ba2a2e715c8d4b98b6f6a2d68235. ADR 0041 fixes the budgets.

format_version = 1

[benchmark]
id = "phase-3-1-bounded-ocr-aarch64-apple-darwin"
workload = "explicit bounded-v2 ONNX CPU OCR 4K, wide, reference, dense, boundary, empty, startup, cleanup, heap, growth, and final process RSS"
phase = "3.1"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "fixtures/ocr/g-004 fixture-manifest.json and its five SHA-256-bound PNGs plus derived deterministic frames"
fixture_sha256 = "a289edb167d45f11f4269cef22ff37d93d2cbe1150201afb9bb3f58439375c4b"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
build_profile = "cargo bench, default features, debug_assertions=false; five fresh alternating-order bounded processes"
warmup_iterations = 3
sample_count = 20
process_count = 5
correctness_oracle = "every warmup and retained sample checks exact text/count/order, fixed fixture geometry/confidence, source/profile identity, detector plan, mapping, runs, sessions, cancellation, heap, growth, and cleanup"
queue_policy = "one synchronous admitted inference, one session pair, two sessions, CPU provider only, no queue or fallback"
producer_surface_copy = "not applicable: immutable CPU replay frames own no producer surface"
notes = "precursor source ce658b3fcbf4ba2a2e715c8d4b98b6f6a2d68235; tree b806af16f228fa8a630f65c0db0ab99c682a67d3; executable sha256 dea9cdfbbb66ba75cb490fc3359efa6ca599786726157a520544cf39b38f81eb; schema 3; runtime sha256 68f6e54e695583adc371aef610ec4abb1ffaa3df656582922de7690f7e2000eb; detector sha256 d2a7720d45a54257208b1e13e36a8479894cb74155a5efe29462512d42f49da9; recognizer sha256 6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884; vocabulary sha256 f7aa897ca828a4c7c9e2739c30f9161a33306d532f020bcdb91dcfb664a5507e; no retry or exclusion; workload RSS fields are cumulative process high-water checkpoints and only final report RSS sets the budget"
benchmark_executable_sha256 = "dea9cdfbbb66ba75cb490fc3359efa6ca599786726157a520544cf39b38f81eb"
final_enforcement_source = "33cd36ba248d37a422f120537922fa4caba5c07d"
final_enforcement_executable_sha256 = "7e48921dfeaa7b0f3a4bb33b9e927eea9e50d75422c570adb6443fd4f32cf190"
deployment_target = "macOS 26.5.2"
cold_load_p95_ms = 92.074
first_close_max_ms = 1.043
reopen_close_max_ms = 64.016
peak_resident_bytes = 464519168

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its text, geometry, order, confidence, source-correlation, and exact resource oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "repeated bounded OCR and result cleanup gives back transient Rust allocations"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 20971520
rationale = "unchanged 20 MiB hard gate; worst precursor peak was 12,695,336 bytes"

[[budget]]
measure = "peak_resident_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 587202560
rationale = "1.25 times the 464,519,168-byte final process high-water, rounded upward to 16 MiB"

[[budget]]
measure = "cold_load_p95"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 125.0
rationale = "1.25 times the 92.074 ms worst precursor cold open, rounded upward to 25 ms"

[[budget]]
measure = "first_close_max"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 2.0
rationale = "1.5 times the 1.043 ms worst first close, rounded upward to 1 ms"

[[budget]]
measure = "reopen_close_max"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 100.0
rationale = "1.25 times the 64.016 ms worst reopen-close, rounded upward to 25 ms"

[[budget]]
measure = "max_detector_tensor_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 11587584
rationale = "ADR 0040 absolute 1312x736 detector rectangle; fitted high-area tensors are smaller"

