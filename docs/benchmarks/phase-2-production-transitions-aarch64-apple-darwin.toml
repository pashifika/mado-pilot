format_version = 1

[benchmark]
id = "phase-2-production-transitions-aarch64-apple-darwin"
workload = "macOS production capture startup, controlled resize, and close transitions"
phase = "2"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "separately linked private macOS fixture Rust, protocol-v11, header, Objective-C, and renderer sources"
fixture_sha256 = "c5576c5290003c723f1d3797ab1c6032e935a9e04ab42d50ce5dc9108bc029ea"
benchmark_executable_sha256 = "b3655f657d20157335cffdea18c32c2a4a6c74b549802afc5dea17097221c2c3"
release_target = "aarch64-apple-darwin"
hardware = "Apple M1 Pro, 10 cores, 32 GiB"
os_version = "macOS 26.5.2 (25F84)"
deployment_target = "macOS 26.5.2"
build_profile = "cargo bench, default features, debug_assertions=false; fixture cargo build --release --features private-fixture; signed .app; controlled NSWorkspace new-instance launch"
warmup_iterations = 5
sample_count = 50
correctness_oracle = "every retained sample checks production frame identity, frame-authoritative geometry, declared fixture content, finite retained progress, exact mapping, or bounded lifecycle outcome; the resize command is stimulus only and never substitutes for a captured result"
queue_policy = "session latest-wins queue depth 1; one bounded private resize stimulus; adapter finite retained-storage limit"
notes = "source commit 7ba689c6496030af38ded5d3af9b9fd1d6234d29, tree 42b80aa2318f428728b733cd68ab42e6b8863251; toolchain rustc 1.97.1; cargo 1.97.1; Apple clang 21.0.0; macOS SDK 26.5; GPU/driver Apple integrated GPU; system driver stack; display topology exactly two online non-mirrored displays; signed-origin 3840x2160 1x; main 2560x1440 logical / 5120x2880 backing 2x; mixed-scale connection method unrestricted; permissions/signing Screen Recording granted; event-post access granted; target bundle structurally ad-hoc signed; fixture executable sha256 40a33a5ceefff9ff01afef52b694799d2a1af91cc355a9d1020dda2a68891374; executable paths deliberately omitted; benchmark and fixture SHA-256 bytes are bound to validity-checked static and audit-token-selected live Security code identities; lineage=production-capture-transitions; mode=default renderer=appkit-background resize-stimulus=private-control"

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies its workload's oracle"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "a repeated operation gives back what it took"
predicate = "allocated_growth_bytes <= 4096"

