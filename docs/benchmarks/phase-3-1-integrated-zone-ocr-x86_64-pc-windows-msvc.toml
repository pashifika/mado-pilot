# Phase 3.1 integrated-zone OCR qualification on Core i7-12700KF. Exact precursor
# source 180c1b15df1a4c29bd6df14a790b9d18ac831bae; ADR 0044 fixes budgets.

format_version = 1

[benchmark]
id = "phase-3-1-integrated-zone-ocr-x86_64-pc-windows-msvc"
workload = "explicit bounded-v2 ONNX CPU singular plus fixed one/three/eight-zone, dense, empty, cancellation, retained-result, startup, cleanup, heap, growth, and final process RSS"
phase = "3.1"
status = "measured"
normative = true
measurements_recorded = true

[profile]
fixture = "fixtures/ocr/g-004 fixture-manifest.json and its five SHA-256-bound PNGs plus derived deterministic frames and fixed caller-order non-overlapping zones"
fixture_sha256 = "a289edb167d45f11f4269cef22ff37d93d2cbe1150201afb9bb3f58439375c4b"
release_target = "x86_64-pc-windows-msvc"
hardware = "Intel Core i7-12700KF, 12 cores/20 logical processors, 32 GiB class"
os_version = "Windows 11 Pro 25H2 build family 26200"
build_profile = "cargo bench, benchmark-instrumentation feature, debug_assertions=false; five fresh alternating-order integrated processes"
warmup_iterations = 3
sample_count = 20
process_count = 5
correctness_oracle = "every warmup and retained sample checks exact text/count/order, ordered-point geometry/confidence, source/envelope/zones/profile, mapping, detector/recognizer work, candidates/memberships/result bytes, ownership, cancellation, heap, growth, and cleanup"
queue_policy = "one synchronous admitted inference, one session pair, two sessions, CPU provider only, no queue or fallback"
producer_surface_copy = "not applicable: immutable CPU replay frames own no producer surface"
notes = "precursor source 180c1b15df1a4c29bd6df14a790b9d18ac831bae; tree 479e4109d39c76adfb745d717648948d060c79b2; executable sha256 b34b99eb7dcb3870edbd768055428be655e1e45ad125400d3b999bfb4da23398; schema 4; runtime DLL sha256 69d8e6d3879a3b4001cdc74c8ed9ccc7e7f799a5b847059738323404519ec471; detector sha256 d2a7720d45a54257208b1e13e36a8479894cb74155a5efe29462512d42f49da9; recognizer sha256 6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884; vocabulary sha256 f7aa897ca828a4c7c9e2739c30f9161a33306d532f020bcdb91dcfb664a5507e; no retry or exclusion; rejected source 7835884 was not built or executed"
benchmark_executable_sha256 = "b34b99eb7dcb3870edbd768055428be655e1e45ad125400d3b999bfb4da23398"
final_enforcement_source = "1ad20315e356105dcb8658d9ddcf26c9250eb699"
final_enforcement_tree = "c06a969b0daae212df339b7e3a1bbbdefddf3e5e"
final_enforcement_executable_sha256 = "cce21732cc7afb5b9c4903b95f732c42e725e7c92591845f6a39482be0ea5504"
deployment_target = "Windows 11 Pro 25H2 build family 26200"
cold_load_p95_ms = 177.934
first_close_max_ms = 4.715
reopen_close_max_ms = 149.277
peak_resident_bytes = 231636992
active_cancellation_max_ms = 4.506
retained_result_max_ms = 702.946

[[budget]]
measure = "result_correctness"
kind = "hard"
requirement = "every retained sample satisfies exact public output and complete singular/grouped resource, ownership, cancellation, and cleanup oracles"
predicate = "result_correctness == 0"

[[budget]]
measure = "allocated_growth_bytes"
kind = "hard"
requirement = "repeated integrated OCR and result cleanup gives back transient Rust allocations"
predicate = "allocated_growth_bytes <= 4096"

[[budget]]
measure = "peak_allocated_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 20971520
rationale = "unchanged ADR 0041 20 MiB hard gate; worst precursor peak was 12,695,304 bytes"

[[budget]]
measure = "peak_resident_bytes"
kind = "absolute"
unit = "bytes"
direction = "at_most"
limit = 301989888
rationale = "unchanged ADR 0041 Windows final process resident ceiling"

[[budget]]
measure = "cold_load_p95"
kind = "absolute"
unit = "milliseconds"
direction = "at_most"
limit = 250.0
rationale = "ADR 0044 keeps the accepted Windows process ceiling; worst precursor was 177.934 ms"

[[budget]]
