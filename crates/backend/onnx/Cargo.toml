[package]
name = "mado-pilot-backend-onnx"
description = "Bounded ONNX Runtime OCR adapter with explicit provider policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
benchmark-instrumentation = []
coreml-provider = ["ort/coreml"]
cuda-provider = ["ort/cuda"]

[dependencies]
libloading = { workspace = true }
mado-pilot-capture = { path = "../../automation/capture" }
mado-pilot-core = { path = "../../automation/core" }
mado-pilot-ocr = { path = "../../automation/ocr" }
opencv = { workspace = true }
ort = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
mado-pilot-testkit = { path = "../../support/testkit" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows.workspace = true

[[bench]]
name = "onnx-cpu"
harness = false

[[bench]]
name = "bounded-detector"
harness = false
required-features = ["benchmark-instrumentation"]

[lints]
workspace = true
