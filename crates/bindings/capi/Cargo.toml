[package]
name = "mado-pilot-capi"
description = "Separately versioned MadoPilot C ABI and ownership boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The C ABI ships as a dynamic library under the reserved `madopilot_` symbol
# prefix. The `lib` kind is kept because this package's own tests and its
# `c-abi-check` example link it as an ordinary Rust library.
#
# `staticlib` is deliberately absent. Gate `G-008` has not recorded which static
# dependency combinations are supported, and emitting that artifact would
# advertise a claim the project has not made.
#
# The reserved ABI-major loader names `madopilot-1.dll` and
# `libmadopilot.1.dylib` are applied by release packaging, which is not
# implemented. What is built here is the undecorated development artifact; see
# `docs/c-abi.md`.
[lib]
name = "madopilot"
crate-type = ["lib", "cdylib"]

# The C boundary's cost, measured against the same work through the facade in
# the same process. `harness = false` because it prints a benchmark profile
# rather than running libtest cases.
[[bench]]
name = "c-boundary"
harness = false

[features]
qualification-unsupported-api = ["mado-pilot/qualification-unsupported-api"]
coreml-provider = ["mado-pilot/coreml-provider"]
cuda-provider = ["mado-pilot/cuda-provider"]
# Builds an explicitly non-production OCR fixture constructor used only by
# local C/C++ examples and ownership probes. It is never enabled by release builds.
private-fixture = []

[dependencies]
mado-pilot = { path = "../../mado-pilot" }

[dev-dependencies]
mado-pilot-testkit = { path = "../../support/testkit" }
mado-pilot-runtime = { path = "../../automation/runtime" }

[lints]
workspace = true
