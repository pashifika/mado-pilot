[package]
name = "mado-pilot"
description = "Public Rust facade for the MadoPilot headless visual automation runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
qualification-unsupported-api = ["mado-pilot-platform-windows/qualification-unsupported-api"]
coreml-provider = ["mado-pilot-backend-onnx/coreml-provider"]
cuda-provider = ["mado-pilot-backend-onnx/cuda-provider"]
native-template-watch-qualification = [
    "mado-pilot-runtime/benchmark-instrumentation",
    "mado-pilot-backend-opencv/benchmark-instrumentation",
    "mado-pilot-platform-macos/private-fixture",
    "mado-pilot-platform-windows/benchmark-instrumentation",
]

[dependencies]
mado-pilot-adapter-replay = { path = "../adapter/replay" }
mado-pilot-backend-onnx = { path = "../backend/onnx" }
mado-pilot-backend-opencv = { path = "../backend/opencv" }
mado-pilot-runtime = { path = "../automation/runtime" }

# The native adapters are wired per target rather than unconditionally, so a
# macOS build resolves no Windows package and a Windows build resolves no macOS
# package. Each platform package already keeps an empty seam off its own target;
# adding the edge here as well means the facade's dependency graph says which
# adapter a build actually contains.
[target.'cfg(windows)'.dependencies]
mado-pilot-platform-windows = { path = "../platform/windows" }

[target.'cfg(target_os = "macos")'.dependencies]
mado-pilot-platform-macos = { path = "../platform/macos" }

[target.'cfg(windows)'.dev-dependencies]
windows.workspace = true
mado-pilot-platform-windows = { path = "../platform/windows", features = ["benchmark-instrumentation"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
mado-pilot-platform-macos = { path = "../platform/macos", features = ["private-fixture"] }
libc.workspace = true

[dev-dependencies]
mado-pilot-testkit = { path = "../support/testkit" }

[[bench]]
name = "deterministic-slice"
harness = false

[[bench]]
name = "native-phase2"
harness = false

[[bench]]
name = "template-watch-query"
harness = false

[[bench]]
name = "native-template-watch"
harness = false
required-features = ["native-template-watch-qualification"]

[lints]
workspace = true
